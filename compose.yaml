name: agent-workspace

x-worker: &worker
  image: agent-workspace:latest
  env_file:
    - path: .env.local
      required: false
  expose:
    - "8080"
  restart: unless-stopped
  mem_limit: 2g
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  gateway:
    image: agent-workspace:latest
    build:
      context: .
    command: ["python", "-m", "src.agent_gateway", "serve", "--host", "0.0.0.0", "--port", "8004"]
    env_file:
      - path: .env.local
        required: false
    ports:
      - "8004:8004"
    restart: unless-stopped
    depends_on:
      batch-resume-review:
        condition: service_healthy
      tender-format-review:
        condition: service_healthy
      smart-resume-screening:
        condition: service_healthy
      contract-review:
        condition: service_healthy
      official-document-review:
        condition: service_healthy
      langchain-knowledge-base:
        condition: service_healthy

  batch-resume-review:
    <<: *worker
    command: ["python", "-m", "uvicorn", "src.agents.batch_resume_review_llm.openai_compatible_api:app", "--host", "0.0.0.0", "--port", "8080"]

  tender-format-review:
    <<: *worker
    command: ["python", "-m", "uvicorn", "src.agents.tender_format_review.openai_compatible_api:app", "--host", "0.0.0.0", "--port", "8080"]

  smart-resume-screening:
    <<: *worker
    command: ["python", "-m", "uvicorn", "src.agents.smart_resume_screening.openai_compatible_api:app", "--host", "0.0.0.0", "--port", "8080"]

  contract-review:
    <<: *worker
    command: ["python", "-m", "uvicorn", "src.agents.contract_review.openai_compatible_api:app", "--host", "0.0.0.0", "--port", "8080"]

  official-document-review:
    <<: *worker
    command: ["python", "-m", "uvicorn", "src.agents.official_document_review.openai_compatible_api:app", "--host", "0.0.0.0", "--port", "8080"]

  langchain-knowledge-base:
    <<: *worker
    command: ["python", "-m", "uvicorn", "src.agents.langchain_knowledge_base.openai_compatible_api:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      KB_DATA_ROOT: /app/data/knowledge_bases
      KB_NAMESPACE: langchain-knowledge-base-agent
      KB_DEFAULT_NAME: default
    volumes:
      - knowledge_base_data:/app/data/knowledge_bases

volumes:
  knowledge_base_data:
