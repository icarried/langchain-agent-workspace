name: agent-workspace

x-worker: &worker
  image: ${AGENT_WORKSPACE_IMAGE:-agent-workspace:latest}
  env_file:
    - path: .env.local
      required: false
  environment:
    HTTP_PROXY: ${GPU_STACK_CONTAINER_PROXY_URL:-}
    HTTPS_PROXY: ${GPU_STACK_CONTAINER_PROXY_URL:-}
    ALL_PROXY: ${GPU_STACK_CONTAINER_PROXY_URL:-}
    NO_PROXY: localhost,127.0.0.1,::1,gateway,batch-resume-review,tender-format-review,smart-resume-screening,contract-review,official-document-review,langchain-knowledge-base,department-knowledge-base,image-generation,comfyui-video-generation,172.16.0.0/12,10.71.0.0/16
  extra_hosts:
    - "host.docker.internal:host-gateway"
  expose:
    - "8080"
  restart: unless-stopped
  mem_limit: 2g
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  department-kb-minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    env_file:
      - path: .env.local
        required: false
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$${DEPARTMENT_KB_MINIO_ACCESS_KEY}"
        test -n "$${DEPARTMENT_KB_MINIO_SECRET_KEY}"
        export MINIO_ROOT_USER="$${DEPARTMENT_KB_MINIO_ACCESS_KEY}"
        export MINIO_ROOT_PASSWORD="$${DEPARTMENT_KB_MINIO_SECRET_KEY}"
        exec minio server /data --address ":9000" --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    volumes:
      - department_kb_minio_data:/data
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gpu-stack-proxy-relay:
    image: ${AGENT_WORKSPACE_IMAGE:-agent-workspace:latest}
    profiles: ["local-proxy"]
    command:
      - python
      - -m
      - src.tcp_relay
      - --listen-host
      - 172.17.0.1
      - --listen-port
      - "17897"
      - --upstream-host
      - 127.0.0.1
      - --upstream-port
      - "7897"
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('172.17.0.1', 17897), 3).close()"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  gateway:
    image: ${AGENT_WORKSPACE_IMAGE:-agent-workspace:latest}
    build:
      context: .
    command: ["python", "-m", "src.agent_gateway", "serve", "--host", "0.0.0.0", "--port", "8008"]
    env_file:
      - path: .env.local
        required: false
    ports:
      - "${AGENT_GATEWAY_PORT:-8008}:8008"
    restart: unless-stopped
    depends_on:
      batch-resume-review:
        condition: service_healthy
      tender-format-review:
        condition: service_healthy
      smart-resume-screening:
        condition: service_healthy
      contract-review:
        condition: service_healthy
      official-document-review:
        condition: service_healthy
      langchain-knowledge-base:
        condition: service_healthy
      department-knowledge-base:
        condition: service_healthy
      image-generation:
        condition: service_healthy
      comfyui-video-generation:
        condition: service_healthy

  batch-resume-review:
    <<: *worker
    command: ["python", "-m", "uvicorn", "src.agents.batch_resume_review_llm.openai_compatible_api:app", "--host", "0.0.0.0", "--port", "8080"]

  tender-format-review:
    <<: *worker
    command: ["python", "-m", "uvicorn", "src.agents.tender_format_review.openai_compatible_api:app", "--host", "0.0.0.0", "--port", "8080"]

  smart-resume-screening:
    <<: *worker
    command: ["python", "-m", "uvicorn", "src.agents.smart_resume_screening.openai_compatible_api:app", "--host", "0.0.0.0", "--port", "8080"]

  contract-review:
    <<: *worker
    command: ["python", "-m", "uvicorn", "src.agents.contract_review.openai_compatible_api:app", "--host", "0.0.0.0", "--port", "8080"]

  official-document-review:
    <<: *worker
    command: ["python", "-m", "uvicorn", "src.agents.official_document_review.openai_compatible_api:app", "--host", "0.0.0.0", "--port", "8080"]

  langchain-knowledge-base:
    <<: *worker
    command: ["python", "-m", "uvicorn", "src.agents.langchain_knowledge_base.openai_compatible_api:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      HTTP_PROXY: ${GPU_STACK_CONTAINER_PROXY_URL:-}
      HTTPS_PROXY: ${GPU_STACK_CONTAINER_PROXY_URL:-}
      ALL_PROXY: ${GPU_STACK_CONTAINER_PROXY_URL:-}
      NO_PROXY: localhost,127.0.0.1,::1,gateway,langchain-knowledge-base,172.16.0.0/12,10.71.0.0/16
      KB_DATA_ROOT: /app/data/knowledge_bases
      KB_NAMESPACE: langchain-knowledge-base-agent
      KB_DEFAULT_NAME: default
    volumes:
      - knowledge_base_data:/app/data/knowledge_bases

  department-knowledge-base:
    <<: *worker
    command: ["python", "-m", "uvicorn", "src.agents.department_knowledge_base.openai_compatible_api:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      HTTP_PROXY: ${GPU_STACK_CONTAINER_PROXY_URL:-}
      HTTPS_PROXY: ${GPU_STACK_CONTAINER_PROXY_URL:-}
      ALL_PROXY: ${GPU_STACK_CONTAINER_PROXY_URL:-}
      NO_PROXY: localhost,127.0.0.1,::1,gateway,department-knowledge-base,172.16.0.0/12,10.71.0.0/16
      KB_DATA_ROOT: /app/data/knowledge_bases
      KB_NAMESPACE: department-knowledge-base-agent
      DEPARTMENT_KB_OBJECT_STORE_ENABLED: "true"
      DEPARTMENT_KB_MINIO_ENDPOINT: department-kb-minio:9000
      DEPARTMENT_KB_MINIO_SECURE: "false"
    depends_on:
      department-kb-minio:
        condition: service_healthy
    volumes:
      - knowledge_base_data:/app/data/knowledge_bases

  image-generation:
    <<: *worker
    command: ["python", "-m", "uvicorn", "src.agents.image_generation.openai_compatible_api:app", "--host", "0.0.0.0", "--port", "8080"]

  comfyui-video-generation:
    <<: *worker
    command: ["python", "-m", "uvicorn", "src.agents.comfyui_video_generation.openai_compatible_api:app", "--host", "0.0.0.0", "--port", "8080"]

volumes:
  knowledge_base_data:
  department_kb_minio_data:
