name: langchain
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - ipykernel
  - pip:
      - langchain
      - langchain-community
      - langchain-core
      - langchain-openai
      - langgraph
      - langsmith
      - python-dotenv
      - pydantic
      - python-docx
      - pypdf
      - PyMuPDF
      - pywin32; platform_system == "Windows"
      - chromadb
      - minio
      - pydantic-settings
      - mcp==1.28.0
      - fastmcp==3.4.2
      - fastapi
      - uvicorn
      - typer
      - rich
      - pytest
      - pytest-asyncio
      - ruff
